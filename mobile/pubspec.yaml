name: flamingocode_mobile
description: "FlamingoCode Mobile — Phone companion for the local-first agentic coding studio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0

  # State Management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.1
  dio: ^5.4.3

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Voice Input
  speech_to_text: ^7.0.0

  # Video Player
  video_player: ^2.8.1

  # JSON & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1

  # Crypto for token hashing (matching server)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/flamingocode-logo-transparent.png
    - assets/models.json